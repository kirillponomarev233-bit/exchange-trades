# Настройки сбора данных. Комментарии начинаются с символа # или ;
# Файл читает scheduler.py

[schedule]
# время ежедневного автоматического запуска (часы:минуты, по времени компьютера)
run_at = 07:30
# если автозапуск не удался, повторить через столько минут
retry_minutes = 30

[database]
path = trades.db

[http]
# пауза между запросами к сайтам бирж, секунды (чтобы не нагружать чужие сайты)
pause_seconds = 1.5

[ccx]
enabled = yes
# при ежедневном запуске обновлять данные за последние N дней
lookback_days = 7

[ets]
enabled = yes
lookback_days = 7
base_url = https://ets.kz
# папка для скачанных файлов Excel
folder = data/ets
